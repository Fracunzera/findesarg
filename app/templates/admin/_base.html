{% extends "base.html" %}
{% block head %}<meta name="robots" content="noindex, nofollow">{% endblock %}
{% block clase_body %}admin{% endblock %}
{% block nav %}{% if csrf %}
<nav class="nav" aria-label="Panel">
  <a href="/admin/eventos" {% if request.url.path.startswith('/admin/eventos') %}aria-current="page"{% endif %}>Eventos</a>
  <a href="/admin/fuentes" {% if request.url.path == '/admin/fuentes' %}aria-current="page"{% endif %}>Fuentes</a>
  <form method="post" action="/admin/salir" class="nav__form">
    <input type="hidden" name="csrf" value="{{ csrf }}">
    <button type="submit">Salir</button>
  </form>
</nav>
{% endif %}{% endblock %}
